# Local stack: KRaft Kafka, Oracle 23ai Free, 2 processor replicas, 1 requestor on :8080.
#   mvn -DskipTests package && docker compose up --build
#   k6 run -e SCENARIO=baseline -e RATE=100 -e DURATION=2m k6/scenarios.js
# Local numbers are for smoke-testing the harness only – never for sign-off.
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports: ["1521:1521"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: payments
      APP_USER_PASSWORD: payments
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      retries: 60

  processor:
    build: .
    deploy:
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: processor
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      SERVER_PORT: "8081"
    depends_on:
      kafka: { condition: service_healthy }
      oracle: { condition: service_healthy }

  requestor:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: requestor
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      INSTANCE_ID: requestor-0
      REPLY_PARTITION: "0"
      AUDIT_ENABLED: "true"
    depends_on:
      kafka: { condition: service_healthy }
      oracle: { condition: service_healthy }
